[package]
name = "kafka-client"
version = "0.1.0"
edition = "2021"
description = "A kafka client"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.86"
arc-swap = "1.7.1"
bytes = "1.7.1"
clap = { version = "4.5.15", features = ["derive"] }
derive_more = { version = "1.0.0", features = ["from"] }
extend = "1.2.0"
fnv = "1.0.7"
futures = "0.3.30"
indexmap = "2.7.1"
indicatif = "0.17.9"
itertools = "0.14.0"
kafka-protocol = { version = "0.14.0", features = ["messages_enums"] }
paste = "1.0.15"
rand = "0.8.5"
thiserror = "1.0.63"
tokio = { version = "1.39.2", features = ["full"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.11", features = ["codec", "rt"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
url = "2.5.2"
uuid = "1.12.0"

[dev-dependencies]
tokio-test = "0.4.4"
tracing-test = "0.2.5"
